<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#151515" />
  <meta name="description" content="Smart Study Assistant - học tập thông minh với RAG, quiz, flashcards và study plans." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,600;0,700;0,800;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles.css" />
  <title>Smart Study Assistant</title>
</head>
<body>
  <div id="page-loader" class="page-loader" aria-live="polite">
    <div class="loader-orbit"><span></span><span></span><span></span></div>
    <p>Đang khởi tạo không gian học tập…</p>
  </div>

  <div class="ambient" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grain"></div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="app"></div>

  <script src="./config.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
